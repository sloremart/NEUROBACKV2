version: '3.9'

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8009:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Revisión IA encendida por defecto; para apagarla: REVISAR_CON_IA=False en el .env y reiniciar
      - REVISAR_CON_IA=${REVISAR_CON_IA:-True}
      - RPA_HUB_URL=http://rpa_bots_api:5055
      - DEMANDA_WEB_URL=http://192.168.1.211:5050

    volumes:
      - /media/disco1/examenes:/media/disco1/examenes
      - /media/disco1/:/neuro
      - /mnt/prueba:/mnt/prueba:rw

  rpa_bots_api:
    build: ./RPA_BOTS_HUB
    container_name: rpa_bots_api
    restart: unless-stopped
    command: python -u api.py
    ports:
      - "5055:5055"
    env_file:
      - path: ./RPA_BOTS_HUB/.env
        required: false
    environment:
      - TZ=America/Bogota
    volumes:
      - rpa_data:/app/data

  demanda_inducida_daemon:
    build: ./demanda_inducida
    container_name: demanda_inducida_daemon
    restart: unless-stopped
    command: python -u main.py
    env_file:
      - path: ./demanda_inducida/.env
        required: false
    environment:
      - TZ=America/Bogota
    volumes:
      - demanda_data:/app/data

  demanda_inducida_web:
    build: ./demanda_inducida
    container_name: demanda_inducida_web
    restart: unless-stopped
    command: python -u app.py
    ports:
      - "5050:5000"
    env_file:
      - path: ./demanda_inducida/.env
        required: false
    environment:
      - TZ=America/Bogota
      - NEUROBACK_API_URL=http://192.168.1.211:8009
    volumes:
      - demanda_data:/app/data

volumes:
  rpa_data:
  demanda_data:

      

