version: '3.9'

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8009:8000"
    env_file:
      - .env
    environment:
      - REVISAR_CON_IA=False

    volumes:
      - /media/disco1/examenes:/media/disco1/examenes
      - /media/disco1/:/neuro
      - /mnt/prueba:/mnt/prueba:rw

      

