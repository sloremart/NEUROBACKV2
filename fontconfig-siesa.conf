<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fuentes de Windows que usan los informes de SIESA (FastReport): sin esto wkhtmltopdf usa
     DejaVu Sans, más ancha, y el texto de las historias clínicas queda amontonado. -->
<fontconfig>
  <alias binding="same"><family>Tahoma</family><prefer><family>Arial</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>Arial</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Microsoft Sans Serif</family><prefer><family>Arial</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Arial</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Arial</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Arial</family><family>Liberation Sans</family></prefer></alias>
</fontconfig>
